name: teaching_children

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # package تغيير أيقونة التطبيق
  flutter_launcher_icons: ^0.14.3

# إعدادات الأيقونة
flutter_launcher_icons:
  android: true
  ios: true

  # مكان صورة الأيقونة
  image_path: "assets/images/app_icon.jpg"

flutter:

  uses-material-design: true


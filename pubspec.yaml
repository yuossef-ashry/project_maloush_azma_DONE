    - assets/sounds/ذ.mp3
    - assets/sounds/ر.mp3
    - assets/sounds/ز.mp3
    - assets/sounds/س.mp3
    - assets/sounds/ش.mp3
    - assets/sounds/ص.mp3
    - assets/sounds/ض.mp3
    - assets/sounds/ط.mp3
    - assets/sounds/ظ.mp3
    - assets/sounds/ع.mp3
    - assets/sounds/غ.mp3
    - assets/sounds/ف.mp3
    - assets/sounds/ق.mp3
    - assets/sounds/ك.mp3
    - assets/sounds/ل.mp3
